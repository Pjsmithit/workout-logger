            const rows = [];
            cur.forEach(c => {
                const p = prev.get(c.name) || null;
                let delta = null;
                if (p) {
                    const parts = []; let dir = 0;
                    if (c.topW !== p.topW) {
                        const d = c.topW - p.topW;
                        parts.push(`${d > 0 ? '+' : '-'}${fmtNum(Math.abs(d))} kg top set`);
                        dir = d > 0 ? 1 : -1;
                    } else if (c.topR !== p.topR) {
                        const d = c.topR - p.topR;
                        parts.push(`${d > 0 ? '+' : '-'}${Math.abs(d)} reps at top weight`);
                        dir = d > 0 ? 1 : -1;
                    } else {
                        parts.push('top set unchanged');
                    }
                    if (p.vol > 0) {
                        const pct = Math.round((c.vol - p.vol) / p.vol * 100);
                        parts.push(`${pct >= 0 ? '+' : '-'}${Math.abs(pct)}% volume`);
                        if (!dir) dir = pct > 0 ? 1 : pct < 0 ? -1 : 0;
                    }
                    delta = { text: parts.join(' · '), dir };
                }
                rows.push({ c, p, delta });
            });
            return rows;
        }

        /* ---------- Rest timer ---------- */
        const rest = { end: 0, iv: null, hideTimer: null, ctx: null, lock: null, done: false };

        function restSeconds() {
            return typeof data._restSeconds === 'number' ? data._restSeconds : 90;
        }

        function audioCtx() {
            try {
                if (!rest.ctx) {
                    const C = window.AudioContext || window.webkitAudioContext;
                    if (C) rest.ctx = new C();
                }
                if (rest.ctx && rest.ctx.state === 'suspended') rest.ctx.resume();
            } catch (e) {}
            return rest.ctx;
        }

        function beep() {
            const ctx = audioCtx();
            if (!ctx) return;
            [0, 0.25, 0.5].forEach((t, i) => {
                const o = ctx.createOscillator(), g = ctx.createGain();
                o.frequency.value = i === 2 ? 1175 : 880;
                g.gain.value = 0.25;
                o.connect(g); g.connect(ctx.destination);
                o.start(ctx.currentTime + t);
                o.stop(ctx.currentTime + t + 0.15);
            });
        }

        async function holdScreen(on) {
            try {
                if (on && 'wakeLock' in navigator && !rest.lock) {
                    rest.lock = await navigator.wakeLock.request('screen');
                    rest.lock.addEventListener('release', () => { rest.lock = null; });
                } else if (!on && rest.lock) {
                    await rest.lock.release();
                    rest.lock = null;
                }
            } catch (e) {}
        }

        function fmtClock(s) {
            return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
        }

        function hideRest() {
            clearInterval(rest.iv); clearTimeout(rest.hideTimer);
            rest.iv = null; rest.hideTimer = null; rest.done = false;
            document.getElementById('restBar').classList.add('hidden');
            document.body.classList.remove('rest-active');
            holdScreen(false);
        }

        function startRest() {
            const s = restSeconds();
            if (!s) return;
            audioCtx(); // unlock sound while we are inside a tap
            rest.end = Date.now() + s * 1000;
            runRest();
        }

        function runRest() {
            clearInterval(rest.iv); clearTimeout(rest.hideTimer);
            rest.done = false;
            const bar = document.getElementById('restBar');
            bar.classList.remove('hidden', 'done');
            document.body.classList.add('rest-active');
            document.getElementById('restLabel').textContent = 'Rest';
            document.getElementById('restSkip').textContent = 'Skip';
            rest.iv = setInterval(tickRest, 250);
            holdScreen(true);
            tickRest();
        }

        function tickRest() {
            const ms = rest.end - Date.now();
            const left = Math.ceil(ms / 1000);
            if (left > 0) {
                document.getElementById('restTime').textContent = fmtClock(left);
                return;
            }
            if (-ms > 30000) { hideRest(); return; } // returned long after it finished
            if (rest.done) return;
            rest.done = true;
            clearInterval(rest.iv); rest.iv = null;
            document.getElementById('restTime').textContent = '0:00';
            document.getElementById('restBar').classList.add('done');
            document.getElementById('restLabel').textContent = 'Rest over, go!';
            document.getElementById('restSkip').textContent = 'Dismiss';
            beep();
            try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
            holdScreen(false);
            rest.hideTimer = setTimeout(hideRest, 20000);
        }

        document.getElementById('restSkip').addEventListener('click', hideRest);
        document.getElementById('restPlus').addEventListener('click', () => {
            rest.end = Math.max(rest.end, Date.now()) + 15000;
            runRest();
        });
        document.getElementById('restMinus').addEventListener('click', () => {
            if (rest.done) return;
            rest.end -= 15000;
            tickRest();
        });
        document.getElementById('restSelect').addEventListener('change', (e) => {
            data._restSeconds = parseInt(e.target.value);
            saveData();
        });
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !document.getElementById('restBar').classList.contains('hidden') && !rest.done) {
                tickRest();
                if (!rest.done && !rest.iv) rest.iv = setInterval(tickRest, 250);
                if (!rest.lock) holdScreen(true);
            }
        });

        function renderExercises() {
            updateWeekPicker();
            const isHome = view === 'home', isLog = view === 'log', isReport = view === 'report';
            document.getElementById('homeView').classList.toggle('hidden', !isHome);
            document.getElementById('logView').classList.toggle('hidden', !isLog);
            document.getElementById('reportView').classList.toggle('hidden', !isReport);
            document.getElementById('backBtn').classList.toggle('hidden', isHome);
            document.getElementById('weekBlock').classList.toggle('hidden', isHome);
            document.getElementById('daySelector').classList.toggle('hidden', !isLog);
            document.getElementById('viewTitle').textContent =
                isHome ? 'Training Tracker' : isReport ? 'Weekly report' : (currentPlan === 'gym' ? 'Gym · Full body' : 'Home workout');
            document.title = isReport ? `Training report - Week ${currentWeek}` : 'Training Tracker';
            document.getElementById('restSelect').value = String(restSeconds());
            if (isHome) {
                renderHome();
            } else if (isLog) {
                renderDays();
                renderLog();
            } else {
                renderReport();
            }
        }

        function renderHome() {
            const dayLabel = DAYS.find(d => d[0] === currentDay)[1];
            ['gym', 'home'].forEach(plan => {
                const list = PLANS[plan][currentWeek] || [];
                const done = list.filter((_, i) => {
                    const d = data[`${plan}_${currentWeek}_${currentDay}_${i}`];
                    return d && d.loggedSets && d.loggedSets.length;
                }).length;
                const el = document.getElementById(plan + 'Status');
                el.textContent = done ? `Week ${currentWeek}, ${dayLabel}: ${done} of ${list.length} exercises logged` : `Week ${currentWeek}, ${dayLabel}: not started`;
                el.classList.toggle('in-progress', done > 0);
            });
            document.getElementById('startDate').value = toISO(getStartDate());
            const s = weekSummary(currentWeek);
            document.getElementById('reportStatus').textContent =
                `Week ${currentWeek}: ${s.trained} workout${s.trained === 1 ? '' : 's'} · ${s.sets} sets`;
        }

        function go(v) {
            view = v;
            editing = null;
            renderExercises();
            window.scrollTo(0, 0);
        }

        document.querySelectorAll('.plan-card[data-plan]').forEach(btn => {
            btn.addEventListener('click', () => { currentPlan = btn.dataset.plan; go('log'); });
        });
        document.getElementById('openReport').addEventListener('click', () => go('report'));
        document.getElementById('backBtn').addEventListener('click', () => go('home'));

        function renderDays() {
            const list = PLANS[currentPlan][currentWeek] || [];
            const el = document.getElementById('daySelector');
            el.innerHTML = '';
            DAYS.forEach(([id, label]) => {
                const base = `${currentPlan}_${currentWeek}_${id}_`;
                const hasData = list.some((_, i) => {
                    const d = data[base + i];
                    return d && ((d.loggedSets && d.loggedSets.length) || d.note);
                }) || (data[base + 'warmup'] || []).length > 0 || (data[base + 'cooldown'] || []).length > 0;
                const b = document.createElement('button');
                b.className = 'day-btn' + (id === currentDay ? ' active' : '') + (hasData ? ' has-data' : '');
                b.textContent = label;
                b.addEventListener('click', () => { currentDay = id; editing = null; renderExercises(); });
                el.appendChild(b);
            });
        }

        function weekSummary(week) {
            let sets = 0, volume = 0, trained = 0;
            const days = DAYS.map(([id, label]) => {
                const sessions = [];
                ['gym', 'home'].forEach(plan => {
                    const items = [];
                    (PLANS[plan][week] || []).forEach((ex, i) => {
                        const d = data[`${plan}_${week}_${id}_${i}`];
                        if (d && ((d.loggedSets && d.loggedSets.length) || d.note)) {
                            const si = ssInfo(plan, week)[i];
                            items.push({ name: ex.exercise, sets: d.loggedSets || [], note: d.note || '', tag: si ? si.tag : '' });
                        }
                    });
                    const warmup = Array.isArray(data[`${plan}_${week}_${id}_warmup`]) ? data[`${plan}_${week}_${id}_warmup`] : [];
                    const cooldown = Array.isArray(data[`${plan}_${week}_${id}_cooldown`]) ? data[`${plan}_${week}_${id}_cooldown`] : [];
                    if (items.length || warmup.length || cooldown.length) sessions.push({ plan, items, warmup, cooldown });
                });
                if (sessions.some(s => s.items.some(it => it.sets.length))) trained++;
                sessions.forEach(s => s.items.forEach(it => it.sets.forEach(x => { sets++; volume += x.weight * x.reps; })));
                return { label, sessions };
            });
            return { days, sets, volume: Math.round(volume), trained };
        }

        function renderReport() {
            const s = weekSummary(currentWeek);
            const prev = currentWeek > 1 ? weekSummary(currentWeek - 1) : null;
            let delta = '';
            if (prev && prev.volume > 0) {
                const pct = Math.round((s.volume - prev.volume) / prev.volume * 100);
                delta = `<span class="stat-label">${pct >= 0 ? '+' : ''}${pct}% vs week ${currentWeek - 1}</span>`;
            }
            let html = `<div class="report-toolbar">
                <div><h2>Training report: Week ${currentWeek}</h2><div class="report-meta">${weekRangeText(currentWeek, '\u2013')} · Generated ${new Date().toLocaleDateString('en-GB')}</div></div>
                <button class="export" onclick="exportReportPdf()">Export PDF</button>
            </div>
            <div class="report-summary">
                <div class="stat"><span class="stat-label">Workouts</span><span class="stat-value">${s.trained}</span></div>
                <div class="stat"><span class="stat-label">Sets</span><span class="stat-value">${s.sets}</span></div>
                <div class="stat"><span class="stat-label">Volume</span><span class="stat-value">${s.volume} kg</span>${delta}</div>
            </div>`;
            if (!s.days.some(d => d.sessions.length)) {
                html += `<div class="empty-state"><p>No workouts logged for week ${currentWeek}.</p></div>`;
            }
            const wow = weekOnWeek(currentWeek);
            if (wow.length) {
                const f = x => `${fmtNum(x.topW)} kg × ${x.topR} top set · ${Math.round(x.vol)} kg volume`;
                html += `<div class="wow"><div class="wow-title">Week on week${currentWeek > 1 ? ` (vs week ${currentWeek - 1})` : ''}</div>` +
                    wow.map(r => {
                        const arrow = !r.delta ? '' : r.delta.dir > 0 ? '▲ ' : r.delta.dir < 0 ? '▼ ' : '– ';
                        const head = r.delta ? `<span class="wow-delta d${r.delta.dir}">${arrow}${r.delta.text}</span>`
                            : `<span class="wow-delta">${currentWeek > 1 ? 'Not logged last week' : ''}</span>`;
                        return `<div class="wow-row"><div class="wow-head"><span class="wow-name">${r.c.name}</span>${head}</div>` +
                            `<div class="wow-line">This week: ${f(r.c)}</div>` +
                            (currentWeek > 1 ? `<div class="wow-line">Week ${currentWeek - 1}: ${r.p ? f(r.p) : 'not logged'}</div>` : '') + `</div>`;
                    }).join('') + `</div>`;
            }
            const sessionBlock = (title, list) => list.length ? `<div class="report-ex"><div class="report-ex-name">${title}</div>${list.map(e => { const d = describeEntry(e); return `<div class="report-set"><span>${d.label}</span><span>${d.detail}</span></div>`; }).join('')}</div>` : '';
            s.days.forEach(day => day.sessions.forEach(sess => {
                let vol = 0;
                sess.items.forEach(it => it.sets.forEach(x => vol += x.weight * x.reps));
                html += `<div class="report-day">
                    <div class="report-day-head"><strong>${day.label} · ${sess.plan === 'gym' ? 'Gym' : 'Home'}</strong><span>${sess.items.length ? Math.round(vol) + ' kg' : ''}</span></div>
                    ${sessionBlock('Warm-up', sess.warmup)}
                    ${sess.items.map(it => `<div class="report-ex"><div class="report-ex-name">${it.name}${it.tag ? ` <span class="ss-tag">${it.tag}</span>` : ''}</div>${it.sets.map((x, n) => `<div class="report-set"><span>Set ${n + 1}</span><span>${x.weight} kg × ${x.reps} reps</span></div>`).join('')}${it.note ? `<div class="report-note">Note: ${escHTML(it.note)}</div>` : ''}</div>`).join('')}
                    ${sessionBlock('Cool-down', sess.cooldown)}
                </div>`;
            }));
            document.getElementById('reportContainer').innerHTML = html;
        }

        function exportReportPdf() {
            const s = weekSummary(currentWeek);
            const L = [];
            L.push({ t: `Training report - Week ${currentWeek}`, size: 18, bold: true });
            L.push({ t: `${weekRangeText(currentWeek, '-')}   |   Generated ${new Date().toLocaleDateString('en-GB')}`, size: 9, gap: 2 });
            L.push({ t: `Workouts: ${s.trained}    Sets: ${s.sets}    Volume: ${s.volume} kg`, size: 11, bold: true, gap: 10 });
            if (!s.days.some(d => d.sessions.length)) L.push({ t: 'No workouts logged this week.', size: 11, gap: 10 });
            const pdfBlock = (title, list) => {
                if (!list.length) return;
                L.push({ t: title, size: 11, bold: true, gap: 6 });
                list.forEach(e => { const d = describeEntry(e); L.push({ t: `${d.label}:  ${d.detail}`, size: 10, indent: 14 }); });
            };
            const wowRows = weekOnWeek(currentWeek);
            if (wowRows.length) {
                const f = x => `${fmtNum(x.topW)} kg x ${x.topR} top set, ${Math.round(x.vol)} kg volume`;
                L.push({ t: `Week on week${currentWeek > 1 ? ` (vs week ${currentWeek - 1})` : ''}`, size: 12, bold: true, gap: 14 });
                wowRows.forEach(r => {
                    L.push({ t: r.c.name, size: 10, bold: true, gap: 5 });
                    L.push({ t: `This week: ${f(r.c)}`, size: 10, indent: 14 });
                    if (currentWeek > 1) {
                        L.push({ t: `Week ${currentWeek - 1}: ${r.p ? f(r.p) : 'not logged'}`, size: 10, indent: 14 });
                        L.push({ t: `Change: ${r.delta ? r.delta.text.replace(/ · /g, ', ') : 'not logged last week'}`, size: 10, indent: 14 });
                    }
                });
            }
            s.days.forEach(day => day.sessions.forEach(sess => {
                let vol = 0;
                sess.items.forEach(it => it.sets.forEach(x => vol += x.weight * x.reps));
                L.push({ t: `${day.label} - ${sess.plan === 'gym' ? 'Gym' : 'Home'}  ${sess.items.length ? `(${Math.round(vol)} kg total)` : ''}`, size: 13, bold: true, gap: 16 });
                pdfBlock('Warm-up', sess.warmup);
                sess.items.forEach(it => {
                    L.push({ t: it.name + (it.tag ? `  (${it.tag})` : ''), size: 11, bold: true, gap: 6 });
                    it.sets.forEach((x, n) => L.push({ t: `Set ${n + 1}:  ${x.weight} kg x ${x.reps} reps`, size: 10, indent: 14 }));
                    if (it.note) wrapText('Note: ' + it.note, 85).forEach(line => L.push({ t: line, size: 10, indent: 14 }));
                });
                pdfBlock('Cool-down', sess.cooldown);
            }));

            const W = 595, H = 842, M = 40;
            const esc = str => String(str).replace(/[^\x20-\x7E]/g, '?').replace(/([\\()])/g, '\\$1');
            const pages = [];
            let ops = [], y = H - M;
            const newPage = () => { pages.push(ops.join('\n')); ops = []; y = H - M; };
            L.forEach(l => {
                const lh = l.size * 1.4, need = (l.gap || 0) + lh;
                if (y - need < M) newPage();
                y -= (l.gap || 0) + l.size;
                ops.push(`BT /${l.bold ? 'F2' : 'F1'} ${l.size} Tf ${M + (l.indent || 0)} ${y.toFixed(1)} Td (${esc(l.t)}) Tj ET`);
                y -= lh - l.size;
            });
            pages.push(ops.join('\n'));

            const objs = [];
            const n = pages.length;
            objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
            objs[2] = `<< /Type /Pages /Count ${n} /Kids [${pages.map((_, i) => `${5 + i * 2} 0 R`).join(' ')}] >>`;
            objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
            objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
            pages.forEach((c, i) => {
                objs[5 + i * 2] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + i * 2} 0 R >>`;
                objs[6 + i * 2] = `<< /Length ${c.length} >>\nstream\n${c}\nendstream`;
            });
            let pdf = '%PDF-1.4\n';
            const offs = [];
            for (let i = 1; i < objs.length; i++) { offs[i] = pdf.length; pdf += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
            const xref = pdf.length;
            pdf += `xref\n0 ${objs.length}\n0000000000 65535 f \n`;
            for (let i = 1; i < objs.length; i++) pdf += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
            pdf += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;

            const bytes = new Uint8Array(pdf.length);
            for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 255;
            const name = `training-report-week-${currentWeek}.pdf`;
            const file = new File([bytes], name, { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: `Training report - Week ${currentWeek}` }).catch(() => {});
                return;
            }
            const url = URL.createObjectURL(file);
            const a = document.createElement('a');
            a.href = url; a.download = name;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            showToast('PDF saved');
        }

        window.addEventListener('beforeprint', () => {
            document.title = `Training report - Week ${currentWeek}`;
        });
        window.addEventListener('afterprint', () => {
            document.title = 'Training Tracker';
        });

        initializeData();
        {
            const s = getStartDate();
            const weeksIn = Math.floor((mondayOf(new Date()) - s) / 604800000) + 1;
            currentWeek = Math.max(1, Math.min(16, weeksIn));
        }
        renderExercises();
    </script>
</body>
</html>
